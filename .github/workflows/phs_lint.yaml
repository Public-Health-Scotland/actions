# Workflow derived from:
# https://github.com/r-lib/actions/blob/v2-branch/examples/lint-changed-files.yaml

name: phs_lint.yaml

on:
  workflow_call:
    inputs:
      changed_files_only:
        description: "Only lint files changed in the pull request"
        required: false
        type: boolean
        default: true
      error_on_lint:
        description: "Fail the job when lint issues are found"
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: Lint R code
    runs-on: ubuntu-latest

    container:
      image: rocker/tidyverse:latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      LINTR_ERROR_ON_LINT: ${{ inputs.error_on_lint && 'true' || 'false' }}

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@351661ca32ac09a36dc5ee2d536e3128f2a3c8ed # v2.22.0
        with:
          egress-policy: audit

      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up R dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: |
            any::gh
            any::lintr
            any::cyclocomp
            local::.
          needs: check

      - name: Lint package
        shell: Rscript {0}
        run: |
          if (
            isTRUE(${{ inputs.changed_files_only && 'TRUE' || 'FALSE' }}) &&
            identical("${{ github.event_name }}", "pull_request")
          ) {
            files <- gh::gh(
              "GET /repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files",
              .limit = Inf
            )

            changed_files <- purrr::map_chr(files, "filename")

            package_files <- list.files(
              recursive = TRUE,
              all.files = TRUE,
              no.. = TRUE
            )

            exclusions <- as.list(
              setdiff(package_files, changed_files)
            )

            lintr::lint_package(exclusions = exclusions)
          } else {
            lintr::lint_package()
          }

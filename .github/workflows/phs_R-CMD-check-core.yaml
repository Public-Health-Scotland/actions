on:
  workflow_call:
    inputs:
      args:
        required: false
        type: string
        default: 'c("--no-manual", "--as-cran")'
        description: "Arguments passed to the args parameter of rcmdcheck (must be an R expression)"
      build_args:
        required: false
        type: string
        default: 'c("--no-manual")'
        description: "Arguments passed to the build_args parameter of rcmdcheck (must be an R expression)"
      error-on:
        required: false
        type: string
        default: '"warning"'
        description: "Check failure threshold passed to rcmdcheck (quoted R string)"

name: R-CMD-check-core.yaml

permissions:
  contents: read

jobs:
  R-CMD-check-linux:
    name: Core R-CMD-check – ubuntu-latest (${{ matrix.r }})
    runs-on: ubuntu-latest
    # Run the job inside a Rocker image
    container:
      image: rocker/r-ver:${{ matrix.r == 'release' && 'latest' || matrix.r }}

    strategy:
      fail-fast: false
      matrix:
        r:
          - release # current CRAN release
          - "4.4.2" # Posit Workbench baseline
          - "4.5.1" # Posit Workbench baseline

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit

      - name: Install git and qpdf
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends git qpdf
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Run R-CMD-check
        uses: r-lib/actions/check-r-package@f9a764fea8d5c63df6ef9a5c7795bf7deb5d7e05 # v2.14.0
        with:
          upload-snapshots: true
          args: ${{ inputs.args }}
          build_args: ${{ inputs.build_args }}
          error-on: ${{ inputs.error-on }}
